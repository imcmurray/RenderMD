name: Build tarball (generic)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libgtksourceview-5-dev \
            pkg-config \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Stage tarball contents
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="rendermd-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE/target/release"
          cp target/release/rendermd "$STAGE/target/release/"
          cp -r data "$STAGE/"
          cp io.github.rendermd.RenderMD.desktop rendermd setup.sh README.md "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"

      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tar.gz'
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
